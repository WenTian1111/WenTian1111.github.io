<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 388" role="img" aria-labelledby="title desc">
<title id="title">Paired static–dynamic study</title><desc id="desc">90 eggs produce 90 still-image records and 270 rolling-trial records, joined by EggID. Dynamic measurements define risk labels; static morphology is used to predict them.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>.th,.t{font:500 14px Arial,sans-serif;fill:#16334a}.ts{font:12px Arial,sans-serif;fill:#607184}.arr{fill:none;stroke:#607184;stroke-width:1.5}.node rect{stroke-width:.5}.c-purple rect{fill:#eeedfe;stroke:#534ab7}.c-teal rect{fill:#e1f5ee;stroke:#0f6e56}.c-gray rect{fill:#f1efe8;stroke:#5f5e5a}</style>
<g class="node c-gray"><rect x="190" y="40" width="300" height="56" rx="8"/><text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">90 physical eggs, one batch</text><text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">Paired image and motion acquisition</text></g>
<path class="arr" d="M340 96V126H180V146" marker-end="url(#arrow)"/><path class="arr" d="M340 126H500V146" marker-end="url(#arrow)"/>
<g class="node c-purple"><rect x="40" y="156" width="280" height="56" rx="8"/><text class="th" x="180" y="174" text-anchor="middle" dominant-baseline="central">90 static image records</text><text class="ts" x="180" y="192" text-anchor="middle" dominant-baseline="central">Contour → morphology descriptors</text></g>
<g class="node c-teal"><rect x="380" y="156" width="260" height="56" rx="8"/><text class="th" x="510" y="174" text-anchor="middle" dominant-baseline="central">270 rolling trial records</text><text class="ts" x="510" y="192" text-anchor="middle" dominant-baseline="central">Motion → PC1 → RSI grades</text></g>
<path class="arr" d="M180 212V242H340V282" marker-end="url(#arrow)"/><path class="arr" d="M510 212V242H340"/>
<text class="ts" x="350" y="260">Join by EggID: 1 image to 3 trials</text>
<g class="node c-gray"><rect x="140" y="292" width="400" height="56" rx="8"/><text class="th" x="340" y="310" text-anchor="middle" dominant-baseline="central">Explain shape–motion associations</text><text class="ts" x="340" y="328" text-anchor="middle" dominant-baseline="central">Predict RSI grade from static morphology</text></g></svg>