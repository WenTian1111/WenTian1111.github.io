    <ellipse cx="834" cy="264" rx="33" ry="33" fill="none" stroke="#0f766e" stroke-width="3" />
    <ellipse cx="657" cy="380" rx="33" ry="33" fill="none" stroke="#0f766e" stroke-width="3" />
    <ellipse cx="834" cy="380" rx="33" ry="33" fill="none" stroke="#0f766e" stroke-width="3" />
    <line x1="910" y1="323" x2="867" y2="264" stroke="#c47a46" stroke-width="2" stroke-dasharray="7 5" />
    <line x1="801" y1="264" x2="690" y2="264" stroke="#c47a46" stroke-width="2" stroke-dasharray="7 5" />
