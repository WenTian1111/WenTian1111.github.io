    <text x="245" y="511" font-size="19" fill="#5a6677" text-anchor="middle">Eulerian reasoning</text>
    <text x="744" y="511" font-size="19" fill="#5a6677" text-anchor="middle">Bridge selection and contour order</text>
    <text x="48" y="552" font-size="17" fill="#5a6677">Schematic geometry · teal: cutting contours · ochre dashes: non-cutting travel</text>
  </g>
</svg>
