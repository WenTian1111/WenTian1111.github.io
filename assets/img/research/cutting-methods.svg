<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">Cutting contours and non-cutting connections</title>
  <desc id="desc">
    Conceptual geometry illustrates Eulerian reasoning for connected contours and linking travel between separate components. This is not a
    reproduction of an optimized path or a scaled manufacturing drawing.
  </desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#0f766e" stroke-width="1.2" />
    </marker>
  </defs>
  <rect width="1000" height="580" fill="#fff" />
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="42" y="45" font-size="17" fill="#5a6677">GEOMETRIC PATH PLANNING</text>
    <text x="42" y="87" font-size="29" fill="#122034">Separate cutting from non-cutting motion</text>
    <text x="49" y="147" font-size="22" fill="#122034">a Connected contours</text>
    <text x="548" y="147" font-size="22" fill="#122034">b Separate components</text>
    <polyline points="85,390 205,200 325,390 85,390 205,465 325,390 415,257 205,200" fill="none" stroke="#0f766e" stroke-width="3" />
