   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f80" x="36.52839" y="116.878175" transform="rotate(-0 36.52839 116.878175)">1  CAPACITY FIRST</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #15324b" transform="translate(36.52839 140.997738)">Sealed 1 L volume; declare V₀ and RH₀</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #15324b" transform="translate(36.52839 154.153137)">V₀ &lt; V₀* → complete evaporation possible</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f80" x="305.371965" y="116.878175" transform="rotate(-0 305.371965 116.878175)">2  ONE COUPLED SYSTEM</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #15324b" transform="translate(305.371965 140.997738)">Liquid loss = vapor gain: dmᵥ/dt = +ṁ</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #15324b" transform="translate(305.371965 154.153137)">Evaporative latent loss couples to Tₛ</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f80" x="588.18144" y="116.878175" transform="rotate(-0 588.18144 116.878175)">3  THRESHOLD-EVENT SOLVER</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #15324b" transform="translate(588.18144 140.997738)">Integrate radius squared and temperature</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #15324b" transform="translate(588.18144 154.153137)">Stop at r = 10 μm; retain cutoff sensitivity</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f80" x="36.52839" y="239.602175" transform="rotate(-0 36.52839 239.602175)">HUMIDITY FEEDBACK</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #15324b" transform="translate(36.52839 263.721738)">Vapor accumulates in the closed volume</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #15324b" transform="translate(36.52839 276.877137)">Higher vapor density lowers evaporation</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f80" x="305.371965" y="239.602175" transform="rotate(-0 305.371965 239.602175)">ENERGY FEEDBACK</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #15324b" transform="translate(305.371965 263.721738)">Air and substrate supply heat</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #15324b" transform="translate(305.371965 276.877137)">Evaporation cools the shrinking droplet</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f80" x="588.18144" y="239.602175" transform="rotate(-0 588.18144 239.602175)">THREE OBSERVABLES</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #15324b" transform="translate(588.18144 263.721738)">RH(t), liquid volume V(t), temperature Tₛ(t)</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #15324b" transform="translate(588.18144 276.877137)">20°C and 25°C compared with identical inputs</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f80" x="36.52839" y="350.638175" transform="rotate(-0 36.52839 350.638175)">4  VERIFY THE CALCULATION</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #15324b" transform="translate(36.52839 377.679738)">Mass / energy balance; independent reduced ODE</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #15324b" transform="translate(36.52839 390.835137)">D²-window fit; solver and stopping-radius tests</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f80" x="455.50539" y="350.638175" transform="rotate(-0 455.50539 350.638175)">5  QUALIFY THE PHYSICS</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #15324b" transform="translate(455.50539 377.679738)">Initial amount, humidity, substrate and transfer sensitivity</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #15324b" transform="translate(455.50539 390.835137)">Synthetic predictions; no observed evaporation dataset</text>
   </g>
  </g>
  <g id="text_17">
   <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #15324b" x="428.4" y="18.597656" transform="rotate(-0 428.4 18.597656)">Closed-container droplet evaporation: capacity, coupling and verification</text>
  </g>
 </g>
