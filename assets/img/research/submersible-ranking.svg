<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">Equipment ranks under two evaluation priorities</title>
  <desc id="desc">
    Reported ranks from Tables 4 and 5 are: sonar 6 to 5, submersible 1 to 6, aerial drone 2 to 1, underwater drone 4 to 2, positioning tag 5 to 4,
    communication buoy 3 to 3. These are rankings in the submitted model, not independently benchmarked hardware performance.
