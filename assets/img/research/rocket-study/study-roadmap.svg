<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 525" role="img"><title>study roadmap</title><style>text{font-family:Arial,sans-serif;fill:#16334a;font-size:14px}.sub{font-size:12px;fill:#607184}.box{fill:#f3f7fa;stroke:#dde5ed;stroke-width:.5}.em{fill:#e6f2ef;stroke:#117b77;stroke-width:.5}.line{fill:none;stroke:#117b77;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#117b77"/></marker></defs><rect width="680" height="525" fill="white"/><text x="40" y="32" font-weight="bold">One model, four successive questions</text><rect x="40" y="58" width="600" height="76" rx="8" class="box"/><circle cx="65" cy="83" r="13" fill="#117b77"/><text x="65" y="88" text-anchor="middle" style="fill:white">A</text><text x="90" y="83" font-weight="bold">One sound source</text><text x="90" y="103">Fit position + emission time</text><text x="90" y="122" class="sub">Seven stations; select A, B, E, G</text><path d="M340 138v24" class="line" marker-end="url(#arrow)"/><rect x="40" y="166" width="600" height="76" rx="8" class="box"/><circle cx="65" cy="191" r="13" fill="#117b77"/><text x="65" y="196" text-anchor="middle" style="fill:white">B</text><text x="90" y="191" font-weight="bold">Unlabeled arrivals</text><text x="90" y="211">Enumerate one arrival per station</text><text x="90" y="230" class="sub">A, B, F, G: 4⁴ = 256 candidate tuples</text><path d="M340 246v24" class="line" marker-end="url(#arrow)"/><rect x="40" y="274" width="600" height="76" rx="8" class="box"/><circle cx="65" cy="299" r="13" fill="#117b77"/><text x="65" y="304" text-anchor="middle" style="fill:white">C</text><text x="90" y="299" font-weight="bold">Four sound sources</text><text x="90" y="319">Select compatible assignments</text><text x="90" y="338" class="sub">No arrival reuse; emission-time span ≤ 5 s</text><path d="M340 354v24" class="line" marker-end="url(#arrow)"/><rect x="40" y="382" width="600" height="76" rx="8" class="box"/><circle cx="65" cy="407" r="13" fill="#117b77"/><text x="65" y="412" text-anchor="middle" style="fill:white">D</text><text x="90" y="407" font-weight="bold">Timing uncertainty</text><text x="90" y="427">Compare perturbed estimates</text><text x="90" y="446" class="sub">Weighted residuals; 0.5 s timing-noise model</text><text x="40" y="501" class="sub">Archive: MATLAB nonlinear fitting → candidate screening → spreadsheet-assisted comparison.</text></svg>