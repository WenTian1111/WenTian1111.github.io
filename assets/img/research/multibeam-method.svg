<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">Sonar geometry and terrain-aware survey planning</title>
  <desc id="desc">A conceptual sonar fan intersects sloping seabed. Effective slope connects a three-dimensional heading to a two-dimensional cross-section; interpolated terrain feeds adaptive line spacing and independent interval-union evaluation.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#5a6677"/></marker></defs>
  <rect width="1000" height="580" fill="#fff"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#102a43">
    <text x="55" y="42" font-size="13" letter-spacing="1.5" fill="#0f766e">GEOMETRY TO PLANNING</text>
    <text x="55" y="83" font-size="26">A local footprint becomes a regional survey</text>
    <text x="55" y="132" font-size="16">a  Cross-section of the sonar fan</text>
    <line x1="45" y1="185" x2="440" y2="185" stroke="#94c7d0" stroke-width="2"/>
    <text x="300" y="174" font-size="13" fill="#5a6677">Sea surface</text>
    <path d="M175 164 H225 L215 184 H185 Z" fill="#24445e"/>
    <path d="M200 185 L80 370 L390 440 Z" fill="#dff3ef"/>
    <path d="M200 185 L80 370 M200 185 L390 440" fill="none" stroke="#0f766e" stroke-width="2.5"/>
    <path d="M45 362 L440 452" stroke="#b7793f" stroke-width="3" fill="none"/>
    <line x1="200" y1="190" x2="200" y2="397" stroke="#5a6677" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="215" y="293" font-size="15">Depth D</text>
    <path d="M182 213 Q203 231 222 214" fill="none" stroke="#24445e" stroke-width="1.5"/>
    <text x="249" y="235" font-size="14">Opening angle θ</text>
    <circle cx="80" cy="370" r="5" fill="#0f766e"/>
    <circle cx="390" cy="440" r="5" fill="#0f766e"/>
    <text x="48" y="335" font-size="13" fill="#5a6677">Shallow edge</text>
    <text x="309" y="416" font-size="13" fill="#5a6677">Deep edge</text>
    <text x="56" y="414" font-size="14" fill="#b7793f">Sloping seabed</text>
    <rect x="45" y="482" width="405" height="57" rx="7" fill="#f1f5f8"/>
    <text x="64" y="506" font-size="14">Heading β → effective cross-section slope</text>
    <text x="64" y="527" font-size="15" fill="#0f766e">tan(α_eff) = tan(α) · |sin(β)|</text>
    <line x1="487" y1="124" x2="487" y2="540" stroke="#dce3ea"/>
    <text x="535" y="132" font-size="16">b  Numerical workflow</text>
    <g font-size="15">
      <rect x="535" y="160" width="410" height="70" rx="8" fill="#f1f5f8" stroke="#dce3ea"/>
      <text x="554" y="186" fill="#0f766e">01 / COVERAGE GEOMETRY</text>
      <text x="554" y="212">Edge-ray intersections + effective slope</text>
      <path d="M740 233 V251" stroke="#5a6677" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="535" y="257" width="410" height="70" rx="8" fill="#f1f5f8" stroke="#dce3ea"/>
      <text x="554" y="283" fill="#0f766e">02 / TERRAIN SURFACE</text>
      <text x="554" y="309">Depth grid + bilinear interpolation</text>
      <path d="M740 330 V348" stroke="#5a6677" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="535" y="354" width="410" height="70" rx="8" fill="#f1f5f8" stroke="#dce3ea"/>
      <text x="554" y="380" fill="#0f766e">03 / ADAPTIVE PLACEMENT</text>
      <text x="554" y="406">Test headings; choose local line spacing</text>
      <path d="M740 427 V445" stroke="#5a6677" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="535" y="451" width="410" height="88" rx="8" fill="#dff3ef" stroke="#95c6bb"/>
      <text x="554" y="477" fill="#0f766e">04 / INTERVAL-UNION EVALUATION</text>
      <text x="554" y="503">Coverage gaps · excess overlap · length</text>
      <text x="554" y="524" font-size="13" fill="#5a6677">Separate evaluator; shared ray–surface layer</text>
    </g>
    <text x="55" y="564" font-size="12" fill="#5a6677">Conceptual geometry, not to scale. The workflow represents the implemented numerical model.</text>
  </g>
</svg>
