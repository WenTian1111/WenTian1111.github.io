<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580"><rect width="1000" height="580" fill="#f5f8fb"/><style>text{font-family:Arial,sans-serif;fill:#24445e}.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.p{font-size:16px}</style><text x="50" y="57" class="title">Constrained Simulation: Evidence Before Conclusions</text><text x="50" y="88" class="p">A general research-verification workflow</text><rect x="50" y="125" width="435" height="98" rx="14" fill="white" stroke="#b9cedc"/><text x="70" y="160" class="h">1. Define the question</text><text x="70" y="193" class="p">Specify scope and assumptions</text><rect x="515" y="125" width="435" height="98" rx="14" fill="white" stroke="#b9cedc"/><text x="535" y="160" class="h">2. Separate evidence layers</text><text x="535" y="193" class="p">Implementation · model · uncertainty</text><rect x="50" y="255" width="435" height="98" rx="14" fill="white" stroke="#b9cedc"/><text x="70" y="290" class="h">3. Compare baselines</text><text x="70" y="323" class="p">Keep evaluation conventions fixed</text><rect x="515" y="255" width="435" height="98" rx="14" fill="white" stroke="#b9cedc"/><text x="535" y="290" class="h">4. Review sensitivity</text><text x="535" y="323" class="p">Distinguish fixed and revised models</text><rect x="50" y="385" width="435" height="98" rx="14" fill="white" stroke="#b9cedc"/><text x="70" y="420" class="h">5. Report bounded conclusions</text><text x="70" y="453" class="p">Record what remains unverified</text><text x="525" y="462" class="h">Transparent research record</text><text x="525" y="494" class="p">Source versions · checks · limitations</text></svg>