<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">Egg rolling-risk model comparison</title>
  <desc id="desc">
    Three dot plots show accuracy, macro F1, and macro AUC for four classifiers. SVM leads on accuracy and F1; gradient boosting leads on AUC. Axes
    run from 50 to 100 percent; no uncertainty estimates were reported.
  </desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#0f766e" stroke-width="1.2" />
    </marker>
  </defs>
