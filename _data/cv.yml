    Projects:
      - name: "ESI-Curvature Modeling of Egg Trajectories: Morphological Effects (Independent Research)"
        summary: "Built a controlled 2.87-degree rolling platform and collected static images of 90 eggs with three trials each (270 videos). Extracted morphology and motion descriptors; vision-based ESI showed 0.788% mean relative error against manual measurement. Constructed a motion-based RSI using PCA and K-means and compared four classifiers. The final thesis reports SVM accuracy of 74.07% and macro F1 of 81.64%, while gradient boosting achieved the highest macro AUC (86.65%). Results use a trial-level split; independent-egg validation remains a next step. Developed the companion Egg_RSI_App research demonstration."
        highlights:
          - Provincial-level Innovation & Entrepreneurship Training Program — Excellent completion
        start_date: 2025-06-01
        end_date: 2026-06-01
      - name: "Machine Vision for Coupled Egg Dynamics & Intelligent Sorting (Leader)"
        summary: "Led and supervised a four-member team in machine-vision-based egg analysis and sorting theses: developed kinematic time-series extraction (centroid, attitude, velocity, acceleration), coupled static morphology with dynamic rolling for risk prediction via a PCA-based rolling stability index, trained four ML classifiers with SVM leading on reported accuracy (74.07%, trial-level split of 270 videos from 90 eggs), clustered trajectories into three stability classes via GMM, and built multi-species egg classifiers from fused HSV and LBP features (8 species, 713 images; KNN 99.30%)."
        highlights:
          - Graduation thesis project of a four-member group, completed successfully
        start_date: 2025-05-01
        end_date: 2026-05-01
      - name: "Research on Multi-Object Localization of Rocket Debris (Independent Research)"
        summary: "Developed a numerical sonic-boom source localization workflow using approximate WGS84-based coordinate preparation, nonlinear least squares (MATLAB lsqnonlin), and a search over 256 arrival-time combinations with feasibility filtering. Studied four-source association and sensitivity to recording noise with a 0.5 s standard deviation; the results estimate airborne boom positions, not validated landing points."
        highlights:
          - Published in Frontier and Progress of Computational Mathematics and Modeling (December 2024, no. 6)
        start_date: 2024-05-01
        end_date: 2024-08-01
      - name: "Mathematical Modeling Competitions (Independent Research)"
        summary: "Independently developed seven competition studies across smartphone analytics, renewable-storage dispatch, bench-dragon kinematics, submersible search, computational biomechanics, cutting-path planning, and constrained geometric simulation. Responsible for mathematical modeling, implementation, analysis, and manuscript preparation."
        highlights:
          - First-class awards at both national and provincial levels
        start_date: 2023-03-01
        end_date: 2026-01-01
