    Projects:
    - name: 'ESI — Curvature Modeling of Egg Trajectories: Morphological Effects'
      summary: Led a team to invent and design an egg rolling test rig, collecting 90 egg samples. Innovatively converted 3D motion into 2D planar motion. Utilized MATLAB with Kalman filtering to extract
        dynamic behavioral features from video sequences. Applied polynomial fitting to analyze the impact of egg shape index and eccentricity on trajectory.
      highlights:
      - Provincial-level undergraduate innovation project (solo approval)
      start_date: 2025-04-01
      end_date: 2026-04-01
    - name: Machine Vision for Coupled Egg Dynamics & Intelligent Sorting
      summary: Led literature review on coupling mechanism of egg morphology, contact interface characteristics, dynamic rolling behavior, and intelligent sorting prediction. Systematically summarized 240
        recent review articles and drafted an initial review manuscript.
      highlights: []
      start_date: 2025-05-01
      end_date: 2026-05-01
    - name: Mathematical Modeling Competitions (Team Leader)
      summary: Led a team in paper writing, modeling, and programming for multiple mathematical modeling competitions. Notable work includes finite element skull modeling using Ogden constitutive model,
        and polar angle iteration with Simpson's numerical integration for dragon formation coiling simulation.
      highlights:
      - National and provincial first-class awards
      - Over 50 competition awards across dozens of contests
      start_date: 2023-05-01
      end_date: 2025-05-01
    - name: Research on Multi-Object Localization of Rocket Debris
      summary: Developed a rocket debris recovery strategy using sonic booms. Optimized WGS84-based tri-sphere and quad-sphere intersection models. Implemented weighted least squares correction with Monte
        Carlo validation, confirming the necessity of at least four detection devices.
      highlights:
      - Published in Frontier and Progress of Computational Mathematics and Modeling
      start_date: 2024-05-01
      end_date: 2024-08-01
